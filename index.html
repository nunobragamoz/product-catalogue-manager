<!DOCTYPE html>
<html lang="pt-PT">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Catálogo de Produtos</title>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header>
        <h1>Gestão de Catálogo de Produtos</h1>
        <p class="subtitulo">Registo, edição e consulta de produtos da loja virtual</p>
    </header>

    <main>

        <!-- ============ FORMULÁRIO DE REGISTO / EDIÇÃO ============ -->

        <section id="product-form" class="cartao">

            <h2 id="form-titulo">Adicionar Produto</h2>

            <form id="add-product-form" novalidate>

                <div class="campo">
                    <label for="name">Nome</label>
                    <input type="text" id="name" placeholder="Nome do Produto" autocomplete="off" required>
                    <small class="erro" id="erro-name"></small>
                </div>

                <div class="campo">
                    <label for="price">Preço (€)</label>
                    <input type="number" id="price" placeholder="0.00" step="0.01" min="0" required>
                    <small class="erro" id="erro-price"></small>
                </div>

                <div class="campo campo-largo">
                    <label for="description">Descrição</label>
                    <input type="text" id="description" placeholder="Descrição do produto" autocomplete="off" required>
                    <small class="erro" id="erro-description"></small>
                </div>

                <div class="campo">
                    <label for="category">Categoria</label>
                    <input type="text" id="category" placeholder="Categoria" list="lista-categorias" autocomplete="off"
                        required>
                    <datalist id="lista-categorias">
                        <option value="Monitores">
                        <option value="Periféricos">
                        <option value="Portáteis">
                        <option value="Componentes">
                        <option value="Armazenamento">
                    </datalist>
                    
                    <small class="erro" id="erro-category"></small>
                </div>

                <div class="campo campo-acoes">
                    <button type="submit" class="btn btn-primario">Adicionar Produto</button>
                    <button type="reset" class="btn btn-neutro">Limpar campos</button>
                </div>

            </form>

        </section>

        <!-- ============ CATÁLOGO ============ -->
        <section id="product-list" class="cartao">

            <div class="cabecalho-seccao">
                <h2>Catálogo de Produtos</h2>
                <span id="contador" class="contador">0 produtos</span>
            </div>

            <!-- Barra de ferramentas: filtro, pesquisa e gestão do ficheiro JSON -->

            <div class="barra-ferramentas">

                <div class="campo">
                    <label for="filtro-categoria">Filtrar por categoria</label>
                    <select id="filtro-categoria">
                        <option value="">Todas as categorias</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="pesquisa">Pesquisar</label>
                    <input type="search" id="pesquisa" placeholder="Nome ou descrição..." autocomplete="off">
                </div>

                <div class="campo campo-acoes">
                    <button type="button" id="btn-exportar" class="btn btn-neutro" title="Descarregar catálogo em JSON">
                        Exportar JSON
                    </button>
                    <button type="button" id="btn-importar" class="btn btn-neutro" title="Carregar catálogo de um JSON">
                        Importar JSON
                    </button>
                    <button type="button" id="btn-limpar" class="btn btn-perigo" title="Remover todos os produtos">
                        Limpar
                    </button>
                    <input type="file" id="ficheiro-json" accept="application/json,.json" hidden>
                </div>

            </div>

            <div class="tabela-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>Nº</th>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Categoria</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="product-table-body">

                        <!-- Produtos serão adicionados aqui dinamicamente -->

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <!-- ============ MODAL DE DETALHES (dados locais + API externa) ============ -->

    <div id="modal-detalhes" class="modal oculto" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">

        <div class="modal-fundo" data-fechar-modal></div>

        <div class="modal-caixa">

            <button type="button" class="modal-fechar" data-fechar-modal aria-label="Fechar">&times;</button>

            <h3 id="modal-titulo">Detalhes do Produto</h3>

            <div id="modal-local" class="modal-bloco"></div>

            <h4>Informação adicional (Fake Store API)</h4>
            <div id="modal-api" class="modal-bloco"></div>

        </div>

    </div>

    <!-- Área das notificações -->
     
    <div id="notificacoes" class="notificacoes" aria-live="polite"></div>

    <footer>
        <p>Prática — Gestão de Catálogo de Produtos | POO • AJAX • JSON • API</p>
    </footer>

    <script src="js/produto.js"></script>
    <script src="js/catalogo.js"></script>
    <script src="js/api.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
